<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#fff5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="fonts.css">
<title>모덕 네컷 (휴대폰)</title>
<script src="characters/list.js"></script>
<script src="../shared/booth-core.js"></script>
<style>
  :root { --bg:#fff5f7; --fg:#2b2b2b; --accent:#ff6b8b; --accent-dark:#e3496c; --muted:#8a8a8a; --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; overflow:hidden; overscroll-behavior:none; }
  body { user-select:none; -webkit-user-select:none; }
  input, select, textarea { user-select:text; -webkit-user-select:text; }
  .screen { position:fixed; inset:0; display:none; flex-direction:column; padding:calc(12px + var(--sat)) 14px calc(12px + var(--sab)); gap:12px; overflow:hidden; }
  .screen.active { display:flex; }
  h1 { font-size:30px; margin:0; color:var(--accent-dark); text-align:center; }
  h2 { font-size:21px; margin:0; text-align:center; }
  p.sub { font-size:15px; color:var(--muted); margin:0; text-align:center; }
  .btn { font-size:20px; font-weight:700; min-height:56px; padding:12px 22px; border:none; border-radius:999px; background:var(--accent); color:#fff; box-shadow:0 6px 18px rgba(255,107,139,.35); }
  .btn:active { transform:scale(.97); }
  .btn:disabled { opacity:.4; }
  .btn.secondary { background:#fff; color:var(--accent-dark); border:3px solid var(--accent); box-shadow:none; }
  .btn.small { font-size:17px; min-height:46px; padding:8px 16px; }
  .btn.wide { width:100%; }
  .row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .grow { flex:1; min-height:0; }

  /* 세팅 */
  #setup { overflow-y:auto; }
  .form { display:flex; flex-direction:column; gap:10px; background:#fff; padding:14px; border-radius:16px; box-shadow:0 6px 20px rgba(0,0,0,.06); }
  .form label { display:flex; flex-direction:column; gap:4px; font-size:15px; color:#555; }
  .form label.inline { flex-direction:row; align-items:center; justify-content:space-between; }
  .form input[type=text], .form select { font-size:18px; padding:11px 12px; border:2px solid #e5e5e5; border-radius:12px; background:#fff; width:100%; }
  .form input[type=checkbox] { width:26px; height:26px; }
  .preview-wrap { display:flex; gap:14px; align-items:center; }
  .preview-wrap canvas { width:38%; height:auto; border-radius:6px; box-shadow:0 6px 20px rgba(0,0,0,.18); background:#fff; }
  .preview-wrap .note { font-size:14px; color:var(--muted); line-height:1.5; }
  .server-status { font-size:14px; color:var(--muted); }

  /* 촬영 */
  #shoot { padding:0; background:#000; color:#fff; }
  .stage { position:relative; flex:1; min-height:0; background:#000; overflow:hidden; }
  video { width:100%; height:100%; object-fit:cover; }
  video.mirror { transform:scaleX(-1); }
  #count { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:38vw; font-weight:800; text-shadow:0 0 30px rgba(0,0,0,.8); pointer-events:none; }
  #flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
  #flash.on { animation:flash .35s ease-out; }
  @keyframes flash { 0% { opacity:1; } 100% { opacity:0; } }
  #shotInfo { position:absolute; top:calc(12px + var(--sat)); left:14px; font-size:20px; font-weight:700; text-shadow:0 2px 8px #000; }
  #camRes { position:absolute; top:calc(12px + var(--sat)); right:14px; font-size:13px; opacity:.7; text-shadow:0 2px 6px #000; }
  .shoot-bar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 18px calc(14px + var(--sab)); background:#111; }
  .thumbs { display:flex; gap:6px; overflow-x:auto; padding:8px 12px 0; background:#111; }
  .thumbs img { height:64px; border-radius:6px; border:2px solid #fff; }
  .shutter { width:84px; height:84px; border-radius:50%; background:#fff; border:6px solid #ff6b8b; font-size:34px; }
  .shutter:active { transform:scale(.94); }
  .round { width:56px; height:56px; border-radius:50%; background:#333; color:#fff; border:none; font-size:26px; }
  .round.ghost { visibility:hidden; }

  /* 사진 고르기 */
  .pick-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; overflow-y:auto; }
  .pick-grid.eight { grid-template-columns:repeat(2,1fr); }
  .pick { position:relative; border-radius:12px; overflow:hidden; border:4px solid transparent; }
  .pick img { width:100%; display:block; }
  .pick.on { border-color:var(--accent); }
  .pick .num { position:absolute; top:8px; left:8px; width:36px; height:36px; border-radius:50%; background:var(--accent); color:#fff; font-size:20px; font-weight:800; display:none; align-items:center; justify-content:center; }
  .pick.on .num { display:flex; }

  /* 프레임 */
  .frames { display:flex; gap:14px; overflow-x:auto; padding:6px 8px 12px; scroll-snap-type:x mandatory; align-items:center; }
  .frame-card { flex:0 0 66%; scroll-snap-align:center; text-align:center; }
  .frame-card canvas { width:100%; height:auto; border-radius:8px; border:4px solid transparent; box-shadow:0 4px 14px rgba(0,0,0,.15); }
  .frame-card.selected canvas { border-color:var(--accent); }
  .frame-card div { font-size:16px; margin-top:4px; }

  /* 꾸미기 — 사진을 크게, 스티커는 아래 한 줄(접을 수 있음) */
  #deco { padding:calc(6px + var(--sat)) 0 0; gap:6px; }
  .deco-top { display:flex; gap:6px; align-items:center; padding:0 10px; flex-shrink:0; }
  .deco-top .tool { font-size:15px; min-height:42px; padding:0 12px; border-radius:999px; border:2px solid #ddd; background:#fff; white-space:nowrap; }
  .deco-top .tool.on { background:#ffe3e9; border-color:var(--accent); }
  .deco-top select { font-size:15px; min-height:42px; padding:0 8px; border-radius:999px; border:2px solid #ddd; background:#fff; flex:1; min-width:0; }
  .canvas-wrap { flex:1; min-height:0; display:flex; justify-content:center; align-items:center; padding:0 10px; position:relative; }
  #stickerCanvas { max-width:100%; max-height:100%; width:auto; height:auto; border-radius:6px; box-shadow:0 8px 24px rgba(0,0,0,.2); background:#fff; touch-action:none; }
  .toast { position:absolute; left:50%; bottom:12px; transform:translateX(-50%); background:rgba(0,0,0,.72); color:#fff; font-size:14px; padding:8px 14px; border-radius:999px; white-space:nowrap; pointer-events:none; transition:opacity .4s; }
  .toast.hide { opacity:0; }
  .sheet { background:#fff; border-radius:16px 16px 0 0; box-shadow:0 -6px 24px rgba(0,0,0,.08); padding:8px 0 calc(8px + var(--sab)); display:flex; flex-direction:column; gap:8px; flex-shrink:0; }
  #deco.collapsed .tabs, #deco.collapsed .palette { display:none; }
  .tabs { display:flex; gap:8px; overflow-x:auto; padding:0 10px; flex-shrink:0; scrollbar-width:none; }
  .tabs::-webkit-scrollbar, .palette::-webkit-scrollbar { display:none; }
  .tab { flex-shrink:0; font-size:15px; min-height:38px; padding:0 14px; border-radius:999px; border:2px solid var(--accent); background:#fff; color:var(--accent-dark); }
  .tab.on { background:var(--accent); color:#fff; }
  .palette { display:flex; gap:8px; overflow-x:auto; padding:2px 10px 4px; height:86px; align-items:center; flex-shrink:0; scrollbar-width:none; }
  .stk { flex-shrink:0; border:2px solid #eee; border-radius:12px; background:#fafafa; padding:4px 10px; min-width:64px; height:74px; display:flex; align-items:center; justify-content:center; }
  .stk:active { transform:scale(.94); }
  .stk.emoji { font-size:38px; line-height:1; }
  .stk.label { font-size:15px; font-weight:700; color:#fff; white-space:nowrap; }
  .stk.character img { height:66px; width:auto; }
  .stk.text-btn { background:#333; color:#fff; font-size:15px; font-weight:700; flex-direction:column; gap:2px; border-color:#333; }
  .stk:disabled { opacity:.35; }
  .deco-actions { display:flex; gap:10px; padding:0 10px; flex-shrink:0; }
  #assetStatus { font-size:13px; color:var(--muted); padding:0 12px; }
  #assetStatus:empty { display:none; }

  /* 완성 */
  #done { overflow-y:auto; }
  #resultImg { max-height:46dvh; width:auto; max-width:100%; align-self:center; border-radius:6px; box-shadow:0 8px 24px rgba(0,0,0,.2); }
  .copies { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .copies .btn { padding:12px 0; }
  #sendStatus { text-align:center; font-size:17px; min-height:24px; color:var(--accent-dark); }
  .hint { text-align:center; font-size:14px; color:var(--muted); }

  /* 고급 설정 */
  #settings { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:flex-end; z-index:50; }
  #settings.open { display:flex; }
  .panel { background:#fff; width:100%; max-height:88dvh; overflow-y:auto; border-radius:18px 18px 0 0; padding:16px 16px calc(16px + var(--sab)); display:flex; flex-direction:column; gap:10px; }
  .panel label { display:flex; flex-direction:column; gap:4px; font-size:15px; color:#555; }
  .panel input, .panel select { font-size:17px; padding:10px 12px; border:2px solid #e5e5e5; border-radius:12px; width:100%; }
  .panel small { color:var(--muted); }
</style>
</head>
<body>

<!-- 1. 행사 세팅 (선생님) -->
<section id="setup" class="screen active">
  <h1 id="titleText">모덕 네컷</h1>
  <p class="sub">행사에 맞게 설정하고 <b>부스 시작</b>. 완성 사진은 학교 구글 드라이브 <b>네컷사진</b> 폴더에 올라가고, 선생님이 출력해요.</p>
  <div class="preview-wrap">
    <canvas id="setupPreview" width="1181" height="1748"></canvas>
    <div class="note">← 인쇄 미리보기<br>회색 칸에 사진 4장이 들어가요.<br><span class="server-status" id="serverStatus">드라이브 연결 확인 중…</span></div>
  </div>
  <div class="form">
    <label>학교/행사 이름 <input type="text" id="setupTitle" maxlength="30" oninput="setupChanged()"></label>
    <label>하단 문구 (비우면 날짜만) <input type="text" id="setupFooter" maxlength="40" placeholder="예: 2026 졸업을 축하해요" oninput="setupChanged()"></label>
    <label>글꼴 <select id="setupFont" onchange="setupChanged()"></select></label>
    <label class="inline">날짜 표시 <input id="setupDate" type="checkbox" onchange="setupChanged()"></label>
    <label>촬영 장수 <select id="setupShots" onchange="setupChanged()">
      <option value="4">4장 찍고 바로 완성</option>
      <option value="6">6장 찍고 4장 고르기</option>
      <option value="8">8장 찍고 4장 고르기</option>
    </select></label>
    <label>프레임 (고정하면 고르는 단계 생략) <select id="setupFrame" onchange="setupChanged()"></select></label>
    <label>스티커 첫 화면 <select id="setupTheme" onchange="setupChanged()"></select></label>
  </div>
  <button class="btn wide" onclick="startBooth()">▶ 부스 시작</button>
  <button class="btn secondary small wide" onclick="openSettings()">고급 설정 (카메라·카운트다운·서버)</button>
</section>

<!-- 2. 촬영 -->
<section id="shoot" class="screen">
  <div class="stage">
    <video id="video" autoplay playsinline muted></video>
    <div id="count"></div>
    <div id="flash"></div>
    <div id="shotInfo"></div>
    <div id="camRes"></div>
  </div>
  <div class="thumbs" id="thumbs"></div>
  <div class="shoot-bar">
    <button class="round" onclick="flipCamera()" aria-label="카메라 전환">🔄</button>
    <button class="shutter" id="shootNowBtn" onclick="shootNow()" aria-label="바로 찍기">📸</button>
    <button class="round" onclick="go('setup')" aria-label="세팅으로">✕</button>
  </div>
</section>

<!-- 3. 사진 고르기 -->
<section id="pick" class="screen">
  <h2>마음에 드는 사진 4장을 순서대로 눌러요</h2>
  <div class="pick-grid grow" id="pickGrid"></div>
  <div class="row">
    <button class="btn secondary small" onclick="startShoot()">다시 찍기</button>
    <button class="btn" id="pickDone" onclick="goFrame()" disabled>다음 →</button>
  </div>
</section>

<!-- 4. 프레임 -->
<section id="frame" class="screen">
  <h2>프레임을 골라요</h2>
  <p class="sub">옆으로 넘겨서 고르세요</p>
  <div class="frames grow" id="frameList"></div>
  <div class="row">
    <button class="btn secondary small" onclick="startShoot()">← 다시 찍기</button>
    <button class="btn" onclick="goDeco()">꾸미기 →</button>
  </div>
</section>

<!-- 5. 꾸미기 -->
<section id="deco" class="screen">
  <div class="deco-top">
    <button class="tool" onclick="stkDelete()">✕ 지우기</button>
    <select id="fontSelect" onchange="setStickerFont(this.value)" aria-label="문구 글꼴"></select>
    <button class="tool" onclick="stkClear()">🗑 전체</button>
    <button class="tool" id="sheetToggle" onclick="toggleSheet()">스티커 ▾</button>
  </div>
  <div class="canvas-wrap">
    <canvas id="stickerCanvas" width="1181" height="1748"></canvas>
    <div class="toast hide" id="decoToast">한 손가락: 옮기기 · 두 손가락: 크기·회전</div>
  </div>
  <div class="sheet">
    <div class="tabs" id="stickerTabs"></div>
    <div id="assetStatus"></div>
    <div class="palette" id="stickerPalette"></div>
    <div class="deco-actions">
      <button class="btn secondary small" onclick="stkClear(); compose()">건너뛰기</button>
      <button class="btn grow" onclick="compose()">완성하기 →</button>
    </div>
  </div>
</section>

<!-- 6. 완성 · 인쇄 보내기 -->
<section id="done" class="screen">
  <img id="resultImg" alt="완성 사진">
  <div id="copyAsk">
    <p class="sub">🖨 몇 장 뽑을까요? (선생님이 드라이브에서 출력해요)</p>
    <div class="copies">
      <button class="btn" onclick="sendPrint(1)">1장</button>
      <button class="btn" onclick="sendPrint(2)">2장</button>
      <button class="btn" onclick="sendPrint(3)">3장</button>
      <button class="btn" onclick="sendPrint(4)">4장</button>
    </div>
  </div>
  <div id="sendStatus"></div>
  <div class="row">
    <button class="btn secondary small" id="retryBtn" onclick="sendPrint(lastCopies)" hidden>다시 보내기</button>
    <button class="btn small" onclick="shareImage()">💾 폰에 저장</button>
    <button class="btn secondary small" id="nextBtn" onclick="startShoot()">인쇄 없이 다시 찍기</button>
  </div>
  <div class="hint" id="autoBack"></div>
  <div class="row"><button class="btn secondary small" onclick="go('setup')">행사 세팅으로</button></div>
</section>

<!-- 고급 설정 -->
<div id="settings" onclick="if(event.target===this)closeSettings()">
  <div class="panel">
    <h2>고급 설정</h2>
    <label>카메라 <select id="setFacing">
      <option value="user">앞 카메라 (셀카, 거울처럼 보임)</option>
      <option value="environment">뒤 카메라 (화질 좋음, 다른 사람이 찍어줄 때)</option>
    </select></label>
    <label>카운트다운(초) <input id="setCount" type="number" min="1" max="10" inputmode="numeric"></label>
    <label>드라이브 업로드 주소 <small>PC 부스의 QR 업로드 주소와 같은 Apps Script 주소 (qr-server/설치방법.md)</small> <input id="setServer" type="text" placeholder="https://script.google.com/macros/s/…/exec"></label>
    <div class="row"><button class="btn secondary small" onclick="testServer(true)">연결 확인</button> <span id="serverTestMsg" class="server-status"></span></div>
    <label style="flex-direction:row;align-items:center;gap:10px"><input id="setAutoQueue" type="checkbox" style="width:24px;height:24px"> PC 자동 인쇄 대기열로 보내기 <small>(보통 끔. PC 에서 인쇄대기.bat 을 켜 둘 때만 — Code.gs 재배포 필요)</small></label>
    <div class="row">
      <button class="btn small" onclick="saveSettings()">저장</button>
      <button class="btn secondary small" onclick="closeSettings()">닫기</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   모덕 네컷 휴대폰판
   - 규격·프레임·스티커·합성은 ../shared/booth-core.js (PC 와 공통)
   - 흐름: 행사 세팅 → 촬영 → (6·8장) 고르기 → 프레임(고정이면 생략) → 꾸미기(시간제한 없음)
           → 매수 선택 → 사진을 Apps Script 로 학교 Drive(네컷사진 폴더)에 올림(파일 이름에 매수) → 다시 촬영
   - 출력은 선생님이 Drive 에서 직접. (선택) print-station/ 을 켜 두면 자동 인쇄도 가능 — 그땐 Code.gs 재배포 필요
   - 휴대폰 글꼴은 4종만 내장(fonts.css): 번호는 PC 와 같음 (0 주아, 3 나눔손글씨 펜, 4 개구쟁이, 9 도현)
   ============================================================ */
const MOBILE_FONTS = [0, 3, 4, 9];
const DEFAULTS = {
  title: '모덕초등학교', footer: '', titleFont: 0, showDate: true, shots: 4, frameId: '', decoTheme: '졸업',
  countdown: 3, facing: 'user', autoQueue: false, ver: 1,
  // PC 와 같은 Apps Script 주소 (qr-server/). 비우면 인쇄 보내기 꺼짐
  serverUrl: 'https://script.google.com/macros/s/AKfycbxR9QIIfbfP4c2pakyOtAcaucuSNNj5D-hFw7sHzTRZ1PfTS1q_y8J2jkdAmOHiOdeZ/exec',
};
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
let S = Object.assign({}, DEFAULTS, JSON.parse(store.get('booth.mobile.settings') || '{}'));
if (!MOBILE_FONTS.includes(S.titleFont)) S.titleFont = 0;
const saveS = () => store.set('booth.mobile.settings', JSON.stringify(S));

var stream = null, shots = [], picked = [], shotCount = 4, selectedFrame = FRAMES[0], resultDataUrl = null, autoBackTimer = null, lastCopies = 1;
var stickers = [], selStk = -1;
let currentFont = STICKER_FONTS[0];

/* ---------- 에셋 (글꼴은 바로, 캐릭터는 부스 시작 후 뒤에서 내려받음) ---------- */
const characterAssets = window.BOOTH_CHARACTERS || [];
STICKER_THEMES.unshift({ name: '학교 캐릭터', items: characterAssets.map(a => ['i', a.id, a.label]) });
const fontReady = Promise.all(MOBILE_FONTS.map(i => document.fonts.load(`400 32px ${STICKER_FONTS[i]}`, '모덕네컷')));
let characterReady = null;
function loadCharacters() {
  if (characterReady) return characterReady;
  characterReady = Promise.all(characterAssets.map(a => new Promise(res => {
    const img = new Image();
    img.onload = () => { characterImages.set(a.id, img); res(true); };
    img.onerror = () => res(false);
    img.src = a.src;
  })));
  return characterReady;
}
MOBILE_FONTS.forEach(i => {
  const o = document.createElement('option'); o.value = STICKER_FONTS[i]; o.textContent = FONT_NAMES[i].split(' · ')[0];
  o.style.fontFamily = STICKER_FONTS[i]; document.getElementById('fontSelect').appendChild(o);
});

/* ---------- 화면 전환 ---------- */
let shootSeq = 0;
function go(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  clearInterval(autoBackTimer);
  if (id !== 'shoot') { shootSeq++; stopCamera(); }
  if (id === 'setup') { shots = []; picked = []; stickers = []; selStk = -1; fillSetup(); renderSetupPreview(); testServer(false); }
  if (id === 'frame') renderFrames();
  window.scrollTo(0, 0);
}

/* ---------- 카메라 ---------- */
async function openCamera() {
  stopCamera();
  const hi = { facingMode: { ideal: S.facing }, width: { ideal: 2560 }, height: { ideal: 2560 }, frameRate: { ideal: 30 } };
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: hi }); }
  catch (e) { stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: S.facing } }); }
  const track = stream.getVideoTracks()[0];
  try {   // 더 큰 해상도를 지원하면 그쪽으로
    const cap = track.getCapabilities ? track.getCapabilities() : null, st = track.getSettings();
    if (cap && cap.width && cap.height && (cap.width.max > st.width || cap.height.max > st.height))
      await track.applyConstraints({ width: { ideal: cap.width.max }, height: { ideal: cap.height.max } });
  } catch (e) {}
  const v = document.getElementById('video');
  v.srcObject = stream;
  const st = track.getSettings ? track.getSettings() : {};
  S.mirror = (st.facingMode || S.facing) !== 'environment';   // 앞 카메라만 거울처럼
  v.classList.toggle('mirror', S.mirror);
  await new Promise(r => v.onloadedmetadata = r);
  try { await v.play(); } catch (e) {}
  document.getElementById('camRes').textContent = `${v.videoWidth}×${v.videoHeight}`;
}
async function flipCamera() {
  S.facing = S.facing === 'user' ? 'environment' : 'user'; saveS();

}
// 다른 앱에 갔다 오면 카메라가 끊길 수 있음 → 촬영 화면이면 다시 켬
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  const t = stream && stream.getVideoTracks()[0];
  if (document.getElementById('shoot').classList.contains('active') && (!t || t.readyState === 'ended')) startShoot();

function beep(freq = 880, dur = 0.08) {
  try {
    const ac = beep.ac || (beep.ac = new (window.AudioContext || window.webkitAudioContext)());
    if (ac.state === 'suspended') ac.resume();
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.value = freq; o.connect(g); g.connect(ac.destination);
    g.gain.setValueAtTime(0.2, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    o.start(); o.stop(ac.currentTime + dur);
  } catch (e) {}
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

// 카메라 화면에서 세로형 사진 비율로 가운데를 잘라 사진 칸 크기(535×690)로 저장 — 미리보기(object-fit: cover)와 같은 영역
function captureFrame() {
  const v = document.getElementById('video');
  const vw = v.videoWidth, vh = v.videoHeight;
  let cw = vw, ch = Math.round(vw / PHOTO_RATIO);
  if (ch > vh) { ch = vh; cw = Math.round(vh * PHOTO_RATIO); }
  const sx = (vw - cw) / 2, sy = (vh - ch) / 2;
  const c = document.createElement('canvas');
  c.width = LAYOUT.photoW; c.height = LAYOUT.photoH;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  if (S.mirror) { ctx.translate(c.width, 0); ctx.scale(-1, 1); }
  ctx.drawImage(v, sx, sy, cw, ch, 0, 0, c.width, c.height);
  sharpen(ctx, c.width, c.height, SHARPEN);
  return c;
}

/* ---------- 촬영 ---------- */
let skipCountdown = false;
function shootNow() { skipCountdown = true; }
async function startShoot() {
  shots = []; picked = []; stickers = []; selStk = -1;
  go('shoot');
  const session = ++shootSeq;
  document.getElementById('thumbs').innerHTML = '';
  const count = document.getElementById('count'), info = document.getElementById('shotInfo');
  try { await openCamera(); }
  catch (e) {
    const msg = e.name === 'NotAllowedError' ? '카메라 사용이 허용되지 않았어요.\n브라우저 설정에서 이 사이트의 카메라를 허용해 주세요.'
      : e.name === 'NotReadableError' ? '다른 앱이 카메라를 쓰고 있어요. 다른 앱을 닫고 다시 시도하세요.'
      : '카메라를 열 수 없어요: ' + e.message;
    if (!confirm(msg + '\n\n[확인] 다시 시도 / [취소] 세팅 화면으로')) { go('setup'); return; }
    if (session !== shootSeq) return;
    startShoot(); return;
  }
  if (session !== shootSeq) return;
  await sleep(500);
  for (let i = 0; i < shotCount; i++) {
    if (session !== shootSeq) return;
    info.textContent = `${i + 1} / ${shotCount}`;
    skipCountdown = false;
    for (let n = S.countdown; n >= 1 && !skipCountdown; n--) {
      count.textContent = n; beep(n === 1 ? 1200 : 880);
      for (let t = 0; t < 10 && !skipCountdown; t++) await sleep(100);
      if (session !== shootSeq) return;
    }
    count.textContent = '';
    const fl = document.getElementById('flash');
    fl.classList.remove('on'); void fl.offsetWidth; fl.classList.add('on');
    beep(1600, 0.15);
    if (navigator.vibrate) navigator.vibrate(40);
    const c = captureFrame();
    shots.push(c);
    const im = document.createElement('img'); im.src = c.toDataURL('image/jpeg', 0.7);
    document.getElementById('thumbs').appendChild(im);
    await sleep(800);
  }
  if (session !== shootSeq) return;
  info.textContent = '';
  stopCamera();
  if (shotCount === 4) { picked = [0, 1, 2, 3]; goFrame(); }
  else showPick();
}

function clampSticker(s) {

  s.x = Math.max(hw, Math.min(W - hw, s.x));

// 터치: 한 손가락 = 옮기기(또는 ↻ 손잡이로 회전), 두 손가락 = 벌려서 크기·돌려서 회전
(function setupTouch() {
  const cv = document.getElementById('stickerCanvas'), ctx = cv.getContext('2d');
  const pts = new Map();   // pointerId → 캔버스 좌표
  let drag = null, rotating = null, pinch = null;
  const pos = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; };
  const two = () => [...pts.values()];
  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    const p = pos(e); pts.set(e.pointerId, p);
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    if (pts.size === 1) {
      if (selStk >= 0 && rotationHandleHit(ctx, stickers[selStk], p.x, p.y)) { rotating = { start: Math.atan2(p.y - stickers[selStk].y, p.x - stickers[selStk].x) * 180 / Math.PI, rot0: stickers[selStk].rot }; return; }
      let hit = -1;
      for (let i = stickers.length - 1; i >= 0; i--) if (stickerHit(ctx, stickers[i], p.x, p.y)) { hit = i; break; }
      selStk = hit;
      if (hit >= 0) { stickers.push(...stickers.splice(hit, 1)); selStk = stickers.length - 1; drag = { dx: p.x - stickers[selStk].x, dy: p.y - stickers[selStk].y }; }   // 맨 위로
      redrawDeco();
    } else if (pts.size === 2 && selStk >= 0) {
      const [a, b] = two(), s = stickers[selStk];
      drag = null; rotating = null;
      pinch = { d0: Math.hypot(b.x - a.x, b.y - a.y), a0: Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI, size0: s.size, rot0: s.rot,
                off: { x: s.x - (a.x + b.x) / 2, y: s.y - (a.y + b.y) / 2 } };
    }
  });
  cv.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    const p = pos(e); pts.set(e.pointerId, p);
    if (selStk < 0) return;
    const s = stickers[selStk];
    if (pinch && pts.size >= 2) {
      const [a, b] = two();
      const d = Math.hypot(b.x - a.x, b.y - a.y), ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
      s.size = Math.max(50, Math.min(600, pinch.size0 * d / pinch.d0));
      s.rot = Math.round(pinch.rot0 + ang - pinch.a0) % 360;
      s.x = (a.x + b.x) / 2 + pinch.off.x; s.y = (a.y + b.y) / 2 + pinch.off.y;
      clampSticker(s); redrawDeco();
    } else if (rotating) {
      const ang = Math.atan2(p.y - s.y, p.x - s.x) * 180 / Math.PI;
      s.rot = Math.round(rotating.rot0 + ang - rotating.start) % 360; redrawDeco();
    } else if (drag) {
      s.x = p.x - drag.dx; s.y = p.y - drag.dy; clampSticker(s); redrawDeco();
    }
  });
  const end = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; if (pts.size === 0) { drag = null; rotating = null; } };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
})();

async function sendPrint(copies) {
  if (!resultDataUrl || !S.serverUrl) return;
  lastCopies = copies = Math.max(1, Math.min(4, copies | 0));
  document.getElementById('copyAsk').hidden = true;
  const st = document.getElementById('sendStatus'), retry = document.getElementById('retryBtn');
  st.textContent = `📡 드라이브로 보내는 중… (${copies}장)`; retry.hidden = true;
  try {
    const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 40000);
    const stamp = new Date().toISOString().replace(/[-:T]/g, '').slice(0, 14);
    const res = await fetch(S.serverUrl, { method: 'POST', signal: ctrl.signal, headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ image: resultDataUrl, name: `네컷_${stamp}_${copies}장`, print: !!S.autoQueue, copies }) });   // 파일 이름에 매수 표시 → 선생님이 보고 출력
    clearTimeout(t);
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || '서버 오류');
    st.textContent = `✅ 드라이브에 올라갔어요! 선생님이 ${copies}장 뽑아 줄 거예요`;
    if (navigator.vibrate) navigator.vibrate([30, 40, 30]);
    let left = 10;
    document.getElementById('nextBtn').textContent = '다음 친구 →';
    const hint = document.getElementById('autoBack');
    hint.textContent = `${left}초 후 다시 촬영을 시작해요`;
    autoBackTimer = setInterval(() => { left--; hint.textContent = `${left}초 후 다시 촬영을 시작해요`; if (left <= 0) { clearInterval(autoBackTimer); startShoot(); } }, 1000);
  } catch (e) {
    st.textContent = '❌ 보내지 못했어요 — 인터넷을 확인하고 다시 보내기';
    retry.hidden = false;
  }
}
async function shareImage() {
  if (!resultDataUrl) return;
  const stamp = new Date().toISOString().replace(/[-:T]/g, '').slice(0, 14);
  const blob = await (await fetch(resultDataUrl)).blob();
  const file = new File([blob], `4cut_${stamp}.jpg`, { type: 'image/jpeg' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: '모덕 네컷' }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = resultDataUrl; a.download = file.name; a.target = '_blank'; a.click();   // 안 되면 새 탭에 열기 → 길게 눌러 저장
}

/* ---------- 고급 설정 ---------- */
function openSettings() {
  document.getElementById('setFacing').value = S.facing;
  document.getElementById('setCount').value = S.countdown;
  document.getElementById('setServer').value = S.serverUrl;
  document.getElementById('setAutoQueue').checked = !!S.autoQueue;
  document.getElementById('serverTestMsg').textContent = '';
  document.getElementById('settings').classList.add('open');
}
function closeSettings() { document.getElementById('settings').classList.remove('open'); }
function saveSettings() {
  S.facing = document.getElementById('setFacing').value === 'environment' ? 'environment' : 'user';
  S.countdown = Math.max(1, Math.min(10, +document.getElementById('setCount').value || DEFAULTS.countdown));
  S.serverUrl = document.getElementById('setServer').value.trim();
  S.autoQueue = document.getElementById('setAutoQueue').checked;
  saveS(); closeSettings(); testServer(false);
}

/* ---------- 시작 ---------- */
applyTitle(); fillSetup(); renderSetupPreview(); testServer(false);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
